name: Site

# The site was pushed to Pages with `wrangler pages deploy` (see SITE.md).
# Three ways to keep it up to date — pick one:
#
#  1. The manual command from SITE.md, run on the box you are working on.
#  2. Git integration: connect this repo once in the Cloudflare dashboard with
#     an empty build command and `site` as the output directory. Cloudflare then
#     deploys on every push by itself, and this workflow is redundant.
#  3. This workflow: add CLOUDFLARE_API_TOKEN (Pages: Edit) and
#     CLOUDFLARE_ACCOUNT_ID as repository secrets and pushes touching site/
#     ship through wrangler instead.
#
# Under 1 or 2 the secrets are absent, so the job skips instead of failing.
on:
  push:
    branches: [main, master]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Site deploy skipped"
              echo "CLOUDFLARE_API_TOKEN is not set. Deploy through the Pages"
              echo "Git integration, or add the two secrets (see SITE.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage site + the latest release's downloads
        id: stage
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A Pages deployment is a full snapshot, so this deploy has to carry
          # /downloads/ too or it deletes the mirror that release.yml put there.
          # scripts/stage-site.sh is the same staging the mirror job uses.
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$tag" ]; then
            scripts/stage-site.sh staging "$tag"
          else
            echo "::warning::no release yet — deploying the site alone"
            scripts/stage-site.sh staging
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler reads the branch from the checkout, so pushes to main land
          # as production and other branches as preview deployments.
          command: pages deploy staging --project-name=abylab
