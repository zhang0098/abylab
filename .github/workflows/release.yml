name: Release

# Tag pushes are the only way a release is published. The `check` job keeps a
# tag on an untested commit from shipping a broken build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)build a release for, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # On a tag push this is the tag; on workflow_dispatch the operator supplies
  # an existing one. Asset names are `abylab-<tag>-<target>.tar.gz`, which is
  # exactly what install.sh looks for.
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Same gate as ci.yml: never publish a tag that does not build, lint or test.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag matches the crate version
        run: |
          set -euo pipefail
          # install.sh compares `abylab --version` with the tag to decide
          # whether an upgrade is needed, so a tag that disagrees with the
          # version compiled into the binary would reinstall the same build on
          # every run. Catch that here instead of shipping it.
          crate=$(grep -m1 '^version = ' crates/abylab-tui/Cargo.toml | cut -d'"' -f2)
          if [ "${TAG#v}" != "$crate" ]; then
            echo "::error::tag $TAG does not match crates/abylab-tui version $crate"
            exit 1
          fi
          echo "tag $TAG matches abylab-tui $crate"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # The Linux assets: one static binary per architecture, linked against musl
  # inside Alpine, whose own libc that is. The image is the whole toolchain,
  # each runner builds its architecture natively, and there is no glibc floor to
  # build down to — the same file runs on glibc 2.x and musl hosts alike, so it
  # cannot die with `/lib/aarch64-linux-gnu/libc.so.6: version `GLIBC_2.39'
  # not found` on an older distribution.
  #
  # `docker run` rather than a `container:` job, because JavaScript actions
  # (checkout, rust-cache, upload-artifact) do not run inside an Alpine
  # container on arm64 runners — see the note in ci.yml.
  #
  # This job is the whole Linux story: there is no second, glibc-flavoured pair
  # of tarballs to publish, and nothing pinned to a glibc version.
  build-linux:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The image carries rust, musl-gcc and the musl libc; nothing is
      # cross-compiled and no extra package is needed. `RUSTFLAGS` and `TARGET`
      # are the only things passed in with the workspace.
      - name: Build in Alpine
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            --env CARGO_TARGET_DIR="$PWD/target" \
            --env RUSTFLAGS \
            --env TARGET \
            rust:alpine \
            sh -euc '
              cargo build --release --locked --target "$TARGET" -p abylab-tui
              # The image is the musl system the asset is for: run it here.
              "./target/$TARGET/release/abylab" --version
            '
          # The container is root; hand the artifacts to the runner user so the
          # cache save and the steps below can read and write them.
          sudo chown -R "$(id -u):$(id -g)" target

      - name: static link
        run: scripts/check-glibc-floor.sh --static "target/${{ matrix.target }}/release/abylab"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="abylab-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/abylab" "dist/$name/"
          cp LICENSE README.md README.en.md TECH.md TECH.en.md install.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      # The Alpine smoke test ran above; this one runs the asset on the glibc
      # runner, which is the other half of the promise.
      - name: Smoke test
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/abylab"
          "$bin" --version || "$bin" --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  build-macos:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p abylab-tui

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="abylab-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/abylab" "dist/$name/"
          cp LICENSE README.md README.en.md TECH.md TECH.en.md install.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/abylab"
          "$bin" --version || "$bin" --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  publish:
    name: publish ${{ inputs.tag || github.ref_name }}
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # `--` keeps names starting with a dash safe; the glob (rather than
          # ./*.tar.gz) keeps the sums file usable with `sha256sum -c`.
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repo, so gh has no git remote to
          # infer the target from; GH_REPO supplies it instead.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Re-running a tag (or a manual dispatch) refreshes the assets
          # instead of failing on an existing release.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber dist/*
          gh release view "$TAG" --json url --jq .url

  # Copy the tarballs onto the site, so abylab.ai/downloads/ serves installs for
  # networks where GitHub Releases is slow or blocked. Same Pages project as
  # site.yml; see SITE.md for the layout and the secrets.
  mirror:
    name: mirror to abylab.ai
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The site is not versioned by the release, so take it from the
          # default branch rather than the tag: re-running this workflow for an
          # older tag (a backfill) must deploy today's site, not that tag's
          # copy of site/ — which predates site/install.sh and still carries
          # the old /install.sh redirect.
          ref: ${{ github.event.repository.default_branch }}

      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Mirror skipped"
              echo "CLOUDFLARE_API_TOKEN is not set, so $TAG was not copied to"
              echo "https://abylab.ai/downloads/. Add CLOUDFLARE_API_TOKEN and"
              echo "CLOUDFLARE_ACCOUNT_ID (see SITE.md), then re-run this"
              echo "workflow with tag=$TAG to backfill it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Is this the latest release?
        id: latest
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The mirror keeps one version at downloads/latest/, and a Pages
          # deployment replaces the whole site — so re-running this workflow
          # for an older tag must not push its assets back over a newer
          # release's.
          newest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ "$newest" = "$TAG" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the latest release ($newest) — nothing mirrored"
          fi

      - name: Stage site + latest assets
        if: steps.latest.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Shared with site.yml: a Pages deployment is a full snapshot, so both
        # deployers have to stage the same shape of directory or they delete
        # each other's half of the live site.
        run: scripts/stage-site.sh staging "$TAG"
      - name: Deploy site + downloads to Cloudflare Pages
        if: steps.latest.outputs.is_latest == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch main is required: a tag push is not a branch, and wrangler
          # would otherwise publish a preview deployment, leaving abylab.ai on
          # the previous build.
          command: pages deploy staging --project-name=abylab --branch main
