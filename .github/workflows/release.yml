name: Release

# Tag pushes are the only way a release is published. The `check` job keeps a
# tag on an untested commit from shipping a broken build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)build a release for, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # On a tag push this is the tag; on workflow_dispatch the operator supplies
  # an existing one. Asset names are `abylab-<tag>-<target>.tar.gz`, which is
  # exactly what install.sh looks for.
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Same gate as ci.yml: never publish a tag that does not build, lint or test.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag matches the crate version
        run: |
          set -euo pipefail
          # install.sh compares `abylab --version` with the tag to decide
          # whether an upgrade is needed, so a tag that disagrees with the
          # version compiled into the binary would reinstall the same build on
          # every run. Catch that here instead of shipping it.
          crate=$(grep -m1 '^version = ' crates/abylab-tui/Cargo.toml | cut -d'"' -f2)
          if [ "${TAG#v}" != "$crate" ]; then
            echo "::error::tag $TAG does not match crates/abylab-tui version $crate"
            exit 1
          fi
          echo "tag $TAG matches abylab-tui $crate"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # Linux binaries are built inside Debian 11 (bullseye), whose glibc is 2.31 —
  # the container *is* the glibc floor. Building on the ubuntu-24.04 runner
  # instead (glibc 2.39) links the host's newer symbols: `__isoc23_*@GLIBC_2.38`
  # from the vendored BoringSSL C code in aws-lc-sys, and `pidfd_spawnp@GLIBC_2.39`
  # from std's weak process reference. The result installs fine and then dies on
  # every older distro with
  #   /lib/aarch64-linux-gnu/libc.so.6: version `GLIBC_2.39' not found
  # scripts/check-glibc-floor.sh asserts the floor on the built binary, so a
  # future image bump fails the release instead of shipping it.
  #
  # macOS runners cannot take a `container:`, hence the two jobs.
  build-linux:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    container: rust:bullseye
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The image ships rustup and a current stable, so the toolchain step the
      # macOS job needs is not repeated here. `cache-bin: false` keeps
      # rust-cache from pruning the image's shims in $CARGO_HOME/bin.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p abylab-tui

      - name: glibc floor
        run: scripts/check-glibc-floor.sh "target/${{ matrix.target }}/release/abylab"

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="abylab-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/abylab" "dist/$name/"
          cp LICENSE README.md README.en.md TECH.md TECH.en.md install.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      # Runs inside bullseye, so this is the floor test end to end: a binary
      # that needs a newer glibc cannot even print its version here.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/abylab"
          "$bin" --version || "$bin" --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  # musl static builds, published next to the glibc pair while the switch is
  # being validated; the plan is to ship these two assets and retire the gnu
  # ones. See the note in ci.yml and scripts/check-glibc-floor.sh --static.
  #
  # Alpine's own libc is musl, so each runner builds its architecture natively:
  # no cross toolchain, no zig, nothing to pin beyond the image tag.
  build-linux-musl:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    container: rust:alpine
    # The container's default shell is sh; the steps below are bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      # bash for the run steps, git for actions/checkout: neither is in the
      # image. `shell: sh` because this is the step that creates bash.
      - name: bash + git
        shell: sh
        run: apk add --no-cache bash git

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # `cache-bin: false` keeps rust-cache from pruning the image's shims in
      # /usr/local/cargo/bin.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p abylab-tui

      - name: static link
        run: scripts/check-glibc-floor.sh --static "target/${{ matrix.target }}/release/abylab"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="abylab-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/abylab" "dist/$name/"
          cp LICENSE README.md README.en.md TECH.md TECH.en.md install.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      # Runs on the musl system the binary was built for — the asset's real
      # platform — so this is a native smoke test, not just a self-check.
      - name: Smoke test
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/abylab"
          "$bin" --version || "$bin" --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  build-macos:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p abylab-tui

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="abylab-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/abylab" "dist/$name/"
          cp LICENSE README.md README.en.md TECH.md TECH.en.md install.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/abylab"
          "$bin" --version || "$bin" --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  publish:
    name: publish ${{ inputs.tag || github.ref_name }}
    needs: [build-linux, build-linux-musl, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # `--` keeps names starting with a dash safe; the glob (rather than
          # ./*.tar.gz) keeps the sums file usable with `sha256sum -c`.
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repo, so gh has no git remote to
          # infer the target from; GH_REPO supplies it instead.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Re-running a tag (or a manual dispatch) refreshes the assets
          # instead of failing on an existing release.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber dist/*
          gh release view "$TAG" --json url --jq .url

  # Copy the tarballs onto the site, so abylab.ai/downloads/ serves installs for
  # networks where GitHub Releases is slow or blocked. Same Pages project as
  # site.yml; see SITE.md for the layout and the secrets.
  mirror:
    name: mirror to abylab.ai
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The site is not versioned by the release, so take it from the
          # default branch rather than the tag: re-running this workflow for an
          # older tag (a backfill) must deploy today's site, not that tag's
          # copy of site/ — which predates site/install.sh and still carries
          # the old /install.sh redirect.
          ref: ${{ github.event.repository.default_branch }}

      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Mirror skipped"
              echo "CLOUDFLARE_API_TOKEN is not set, so $TAG was not copied to"
              echo "https://abylab.ai/downloads/. Add CLOUDFLARE_API_TOKEN and"
              echo "CLOUDFLARE_ACCOUNT_ID (see SITE.md), then re-run this"
              echo "workflow with tag=$TAG to backfill it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Is this the latest release?
        id: latest
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The mirror keeps one version at downloads/latest/, and a Pages
          # deployment replaces the whole site — so re-running this workflow
          # for an older tag must not push its assets back over a newer
          # release's.
          newest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ "$newest" = "$TAG" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the latest release ($newest) — nothing mirrored"
          fi

      - name: Stage site + latest assets
        if: steps.latest.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Shared with site.yml: a Pages deployment is a full snapshot, so both
        # deployers have to stage the same shape of directory or they delete
        # each other's half of the live site.
        run: scripts/stage-site.sh staging "$TAG"
      - name: Deploy site + downloads to Cloudflare Pages
        if: steps.latest.outputs.is_latest == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch main is required: a tag push is not a branch, and wrangler
          # would otherwise publish a preview deployment, leaving abylab.ai on
          # the previous build.
          command: pages deploy staging --project-name=abylab --branch main
