name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host-side checks: formatting, lints, tests. Runs once on Linux x86_64 so the
  # build jobs below stay a pure "does it compile, and does it link the way we
  # promise" pair.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The site serves its own copy of the installer, so
      # `curl https://abylab.ai/install.sh | bash` never has to reach GitHub,
      # while the packaged tarball ships the repo's file. Same script in two
      # places; this is what keeps them from drifting. The syntax check also
      # covers the Pages staging both deploy workflows call.
      - name: install.sh and site/install.sh are in sync
        run: |
          set -euo pipefail
          bash -n install.sh scripts/stage-site.sh scripts/release.sh
          if ! diff -u install.sh site/install.sh; then
            echo "::error::site/install.sh is stale — fix with: cp install.sh site/install.sh"
            exit 1
          fi
          echo "site/install.sh matches install.sh"

      # Deploying references the CSS and JS under hashed URLs, so a stale copy
      # can never outlive a deploy. If the rewrite breaks, the deployed HTML
      # points at a file nobody uploaded and every visitor gets an unstyled
      # page — worth a check that does not need a deploy to find out.
      - name: Staged pages reference the hashed assets
        run: |
          set -euo pipefail
          rm -rf staging-check
          scripts/stage-site.sh staging-check
          for asset in styles.css app.js vendor/pico.min.css; do
            hash=$(sha256sum "staging-check/$asset" | cut -c1-12)
            for page in staging-check/index.html staging-check/en/index.html staging-check/404.html; do
              if ! grep -q "/$asset?v=$hash" "$page"; then
                echo "::error::$page does not reference /$asset?v=$hash"
                exit 1
              fi
              if grep -q "\"/$asset\"" "$page"; then
                echo "::error::$page still links /$asset unversioned"
                exit 1
              fi
            done
          done
          rm -rf staging-check
          echo "staged pages carry content-hashed asset URLs"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      # `--all-features` matters: it enables abycore's web-search feature.
      # Live network tests are #[ignore]d, so no API keys are needed here.
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # Cross-platform release builds for the four supported targets.
  # macos-14 runners are Apple Silicon; macos-15-intel is the Intel image.
  #
  # The Linux assets: one static binary per architecture, linked against musl
  # inside Alpine, whose own libc that is. The image is the whole toolchain,
  # each runner builds its architecture natively, and there is no glibc floor to
  # build down to — the same file runs on glibc and musl hosts alike.
  #
  # `docker run` rather than a `container:` job, because JavaScript actions
  # (checkout, rust-cache, upload-artifact) do not run inside an Alpine
  # container on arm64 runners — the runner says so and stops the job:
  #   JavaScript Actions in Alpine containers are only supported on x64 Linux
  #   runners. Detected Linux Arm64
  build-linux:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The image carries rust, musl-gcc and the musl libc; nothing is
      # cross-compiled and no extra package is needed. `RUSTFLAGS` and `TARGET`
      # are the only things passed in with the workspace.
      - name: Build in Alpine
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            --env CARGO_TARGET_DIR="$PWD/target" \
            --env RUSTFLAGS \
            --env TARGET \
            rust:alpine \
            sh -euc '
              cargo build --release --locked --target "$TARGET" -p abylab-tui
              # The image is the musl system the asset is for: run it here.
              "./target/$TARGET/release/abylab" --version
            '
          # The container is root; hand the artifacts to the runner user so the
          # cache save and the steps below can read and write them.
          sudo chown -R "$(id -u):$(id -g)" target

      - name: static link
        run: scripts/check-glibc-floor.sh --static "target/${{ matrix.target }}/release/abylab"

      - name: Package
        run: |
          set -euo pipefail
          name="abylab-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/abylab" "dist/$name/"
          cp LICENSE README.md README.en.md TECH.md TECH.en.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
        id: package

      # The Alpine smoke test ran above; this one runs the asset on the glibc
      # runner, which is the other half of the promise.
      - name: Smoke test
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/abylab"
          "$bin" --version || "$bin" --help

      - uses: actions/upload-artifact@v7
        with:
          name: abylab-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  build-macos:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p abylab-tui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="abylab-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/abylab" "dist/$name/"
          cp LICENSE README.md README.en.md TECH.md TECH.en.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
        id: package

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/abylab"
          "$bin" --version || "$bin" --help

      - uses: actions/upload-artifact@v7
        with:
          name: abylab-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error
